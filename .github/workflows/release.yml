name: Release

on:
  push:
    tags:
    - '*'

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  linux:
    uses: ./.github/workflows/build-static.yml

  debian:
    uses: ./.github/workflows/build-deb.yml

  release:
    name: Draft release
    needs: [windows, macos, linux, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq dos2unix
        TAG=$GITHUB_REF_NAME
        mkdir release
        echo "To use configs and certificates, move all files and certificates folder from contrib directory here." > README.txt
        unix2dos -q contrib/i2pd.conf contrib/tunnels.conf contrib/tunnels.d/* contrib/webconsole/style.css
        for build in x64:win64 x86:win32 xp:winxp arm64:winarm64; do
          cp artifacts/i2pd-${build%%:*}.exe/i2pd.exe i2pd.exe
          zip -qr9 release/i2pd_${TAG}_${build#*:}_mingw.zip i2pd.exe README.txt \
            contrib/i2pd.conf contrib/tunnels.conf contrib/certificates contrib/tunnels.d contrib/webconsole
        done
        chmod +x artifacts/i2pd-macos/i2pd
        tar -czf release/i2pd_${TAG}_osx.tar.gz -C artifacts/i2pd-macos i2pd
        cp artifacts/i2pd-linux-all/* release/
        cp artifacts/i2pd_trixie_*/i2pd_*.deb release/
        cd release
        sha512sum -b * > SHA512SUMS
        ls -l

    - name: Create draft release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: release/*
        fail_on_unmatched_files: true
