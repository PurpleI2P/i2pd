# Transparent-proxy smoke-test config
# Matches:  iptables -t nat -A OUTPUT -p tcp -d 10.108.0.0/16 -j REDIRECT --to-ports 9041
#
# datadir is supplied on the command line (--datadir) by run-test.sh.

loglevel = info

# Silence the default proxies so the test is isolated and avoids port clashes.
[httpproxy]
enabled = false
[socksproxy]
enabled = false
[sam]
enabled = false

[transproxy]
enabled = true
# You used REDIRECT (NAT), not TPROXY.
type = redirect
# Bind all local addresses: an OUTPUT REDIRECT delivers to the *outgoing
# interface's* primary address, which is often NOT 127.0.0.1. Binding
# 0.0.0.0 receives it regardless of which interface the kernel picks.
address = 0.0.0.0
# Must match your --to-ports.
port = 9041
# MUST equal the CIDR your iptables rule redirects. The DNS resolver hands
# out virtual IPs from this range, and the transparent proxy only accepts
# destinations inside it. If this differs from your -d range, nothing works.
virtualnet = 10.108.0.0/16
# Share the router's local destination (no separate keys/leaseset).
keys = shareddest

[dnsresolver]
enabled = true
# Point test apps (or a dnsmasq forward) here for .i2p.
address = 127.0.0.1
port = 5353
