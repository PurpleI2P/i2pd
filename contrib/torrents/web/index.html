<style>
.progress-cell {
    position: relative;
    padding: 0;
    height: 18px;
    min-width: 110px;
}

.progress-bar {
    position: absolute;
    inset: 0;
    background: #e5e7eb;
}

.progress-fill {
    height: 100%;
}

.progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #111;
    line-height: 1;
}

.compact-table {
    border-collapse: collapse;
    width: 100%;
}

.compact-table td,
.compact-table th {
    border: 1px solid black;
    padding: 0 4px;
    height: 18px;
    line-height: 1.3;
    overflow-wrap: anywhere;
    box-sizing: border-box;
}

#fs-error fieldset {
    padding: 0;
    margin: 0;
}

#fs-error h2,
#fs-error h3 {
    margin-top: 10;
    margin-bottom: 10;
    margin-left: 10;
}

td.buttons-cell {
    padding: 0;
    max-width: 100px;
}

.buttons-cell .button-row {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    gap: 0;
}

.button-column {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 5px;
}

.buttons-cell button,
.buttons-column button,
.button-row button {
    flex: 1;
    margin: 0;
    border: 1px;
    border-radius: 0;
    min-width: 0;
    line-height: 1;
}

.button-row button:hover {
    background-color: orange;
}

.fs-buttons {
    width: 100%;
    max-width: 100px;
    box-sizing: border-box;
}

.container {
    display: flex;
}

fieldset {
    flex: 1;
    min-width: 0;
}
</style>

<script src="./rpc.js"></script>
<script>
    window.rpc = new TorrentClient();
</script>

<div id="fs-error">
    <fieldset>
        <h2 style="color: #ff3333;" id="err-string">failed to load main.js</h2>
        <h3 id="err-details"></h3>
    </fieldset>
</div>

<div class="container">
    <fieldset class="fs-buttons">
        <legend>Actions</legend>
        <div class="button-column">
            <input type="file" id="torrentf" accept=".torrent" style="display: none" />
            <button title="Open torrent file" onclick="document.getElementById('torrentf').click()">📂</button>
            <button title="Add magnet" onclick="addMagnet()">🧲</button>
        </div>
    </fieldset>

    <fieldset id="fs-session-stats">
        <legend>Session stats:</legend>
        <div id="session-stats-list"></div>
    </fieldset>

    <fieldset id="fs-dht-stats" style="display: none">
        <legend>DHT stats:</legend>
        <div id="dht-stats-list"></div>
    </fieldset>
</div>

<div class="container" id="stats"></div>
<div id="torrents"></div>
<div id="details"></div>

<script src="./main.js"></script>
