<style>
    /* error */
    #error fieldset {
        padding: 0;
        margin: 0;
    }

    #error h2,
    #error h3 {
        margin: 10px;
    }

    /* progressbar in table cell */
    .progress-cell {
        position: relative;
        padding: 0;
        height: 18px;
        min-width: 120px;
    }

    .progress-bar,
    .progress-text {
        position: absolute;
        inset: 0;
    }

    .progress-bar {
        background: #e5e7eb;
    }

    .progress-fill {
        height: 100%;
    }

    .progress-text {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #111;
        line-height: 1;
    }

    /* tables */
    .compact-table {
        width: 100%;
        border-collapse: collapse;
    }

    .compact-table td,
    .compact-table th {
        box-sizing: border-box;
        height: 18px;
        padding: 0 4px;
        border: 1px solid black;
        line-height: 1.3;
        overflow-wrap: anywhere;
    }

    /* highlighting row in table */
    .highlight-row {
        cursor: pointer;
        transition: background-color 0.1s ease;
    }

    .highlight-row:hover td {
        background: #ffe6008e;
    }

    .button-column {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        gap: 5px;
    }

    .action-buttons {
        width: 100%;
        max-width: 100px;
        box-sizing: border-box;
    }

    /* right-click-menu */
    .rcm {
        position: fixed;
        z-index: 10000;
        min-width: 100px;
        background: #fff;
        color: #000;
        box-shadow: 0 4px 12px #0009;
        border: 1px solid #7a7a7a;
        font-size: 14px;
    }

    .rcm[hidden] {
        display: none;
    }

    .rcm [data-action] {
        padding: 1px 4px;
        cursor: pointer;
    }

    .rcm [data-action]:hover {
        background: #e8e8e8;
    }

    .rcm hr {
        border: 0;
        border-top: 1px solid #ddd;
    }

    .container {
        display: flex;
    }

    fieldset {
        flex: 1;
        min-width: 0;
    }
</style>

<div id="rcm" class="rcm" hidden></div>

<div id="error">
    <fieldset>
        <h2 style="color: #ff3333;" id="error-message">failed to load main.js</h2>
        <h3 style="white-space: pre-line;" id="error-details"></h3>
    </fieldset>
</div>

<div class="container">

    <fieldset class="action-buttons">
        <legend>Actions</legend>
        <div class="button-column">
            <input type="file" id="file-dialog" accept=".torrent" multiple style="display: none" />
            <button title="Open torrent file" onclick="document.getElementById('file-dialog').click()">📂</button>
            <button title="Add magnet" onclick="util.dialog.addMagnet()">🧲</button>
        </div>
    </fieldset>

    <fieldset id="session-stats-fs" style="display: none">
        <legend>Session stats:</legend>
        <div id="session-stats-list"></div>
    </fieldset>

    <fieldset id="dht-stats-fs" style="display: none">
        <legend>DHT stats:</legend>
        <div id="dht-stats-list"></div>
    </fieldset>
</div>

<div id="torrents"></div>
<div id="details"></div>

<script src="./utils.js"></script>
<script src="./main.js"></script>
