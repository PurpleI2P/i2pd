##
## This is stripped-down i2pd.conf, optimized for a home router with limited RAM and CPU.
## Read the docs 
## https://docs.i2pd.website/en/latest/user-guide/configuration/
## and look at full i2pd.conf 
## https://github.com/PurpleI2P/i2pd/tree/openssl/contrib

tunconf = /etc/i2pd/tunnels.conf
tunnelsdir = /etc/i2pd/tunnels.d
certsdir = /usr/share/i2pd/certificates
log = syslog
loglevel = error
## OpenWrt procd init expects services to start as if they were to run in the foreground, 
## read https://openwrt.org/docs/guide-developer/procd-init-scripts
daemon = false
# nat = true
## Network interface to bind to, adjust according to your device configuration
ifname = wan
# ifname4 = 
# ifname6 = 
# address4 =
# address6 =
# host = 
# port = 
ipv4 = true
ipv6 = false
bandwidth = O
notransit = true
floodfill = false

[ntcp2]

[ssu2]

[http]
## Web Console
enabled = true
address = 192.168.1.1
port = 7070

[httpproxy]
enabled = true
address = 192.168.1.1
port = 4444

[socksproxy]
enabled = true
address = 192.168.1.1
port = 4447

[sam]

[bob]

[i2cp]

[i2pcontrol]
enabled = true
address = 192.168.1.1
port = 7650

[precomputation]

[upnp]
## Compile with UPnP enabled
# enabled = true
# name = I2Pd

[meshnets]

[reseed]
verify = true

[addressbook]

[limits]
transittunnels = 256

[trust]

[exploratory]

[persist]
## Do not save peer profiles and full addresses to disk 
## if you don't have enough space on external storage or in RAM tmpfs.
## Don't use internal flash!
profiles = false
addressbook = false

